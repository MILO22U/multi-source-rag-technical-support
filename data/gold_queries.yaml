# =============================================================================
# Gold evaluation set -- 15 queries with graded relevance labels.
#
# Labels are hand-verified against the corpus, NOT generated by the system under
# test. An LLM-labelled gold set scored by an LLM pipeline is circular, and the
# circularity silently inflates every number in the report.
#
# `relevant` entries address chunks by id at either granularity:
#   docs:retries-and-backoff                        -> any chunk of that document
#   docs:retries-and-backoff:default-retry-policy    -> that section only
# Matching is exact-or-prefix (Chunk.matches_label), which is why chunk ids are
# content-addressed rather than ordinal -- ordinals would shift whenever chunking
# parameters changed and invalidate every label here.
#
# grade: 2 = directly answers the question
#        1 = partially relevant / useful supporting context
#
# `expects_conflict` names the planted conflict from data/conflicts_planted.json
# that this query should surface. `expects_refusal` marks out-of-scope queries.
# =============================================================================

queries:
  - qid: q01
    query: "What is the maximum payload size for a Zephyr job?"
    intent: api_reference
    note: "Pure reference lookup. Single authoritative source, no conflict in the top result."
    expected_sources: [docs]
    relevant:
      - { id: "docs:job-payloads", grade: 2 }
      - { id: "forum:t_0044", grade: 1 }
    answer_must_contain: ["256"]
    answer_must_not_contain: ["1 MB"]

  - qid: q02
    query: "Why do my jobs retry forever when the API returns 429?"
    intent: troubleshooting
    note: "Forum-led troubleshooting. The documented behaviour is correct for 3.1+ but three independent threads report the 3.0 bug."
    expected_sources: [forum, docs]
    relevant:
      - { id: "forum:t_0041", grade: 2 }
      - { id: "docs:rate-limits", grade: 2 }
      - { id: "forum:t_0063", grade: 1 }
      - { id: "forum:t_0052", grade: 1 }
    expects_conflict: C7
    answer_must_contain: ["Retry-After"]

  - qid: q03
    query: "Why does Zephyr use exponential backoff instead of fixed delays?"
    intent: conceptual
    note: "Design rationale. Docs say what, the blog says why -- blog should dominate."
    expected_sources: [blog]
    relevant:
      - { id: "blog:why-exponential-backoff", grade: 2 }
      - { id: "docs:retries-and-backoff", grade: 1 }
    answer_must_contain: ["jitter"]

  - qid: q04
    query: "What is the default retry count?"
    intent: api_reference
    note: "C1 version drift: docs say 5 (v3), a 2025 blog says 3 (v2 era). Must never average to '3 to 5'."
    expected_sources: [docs]
    relevant:
      - { id: "docs:retries-and-backoff:default-retry-policy", grade: 2 }
      - { id: "docs:changelog", grade: 1 }
      - { id: "blog:scaling-to-1m-jobs", grade: 1 }
    expects_conflict: C1
    answer_must_contain: ["5"]
    answer_must_not_contain: ["3 to 5", "between 3 and 5"]

  - qid: q05
    query: "Can I set timeout=0 to disable the timeout?"
    intent: how_to
    note: "C2 misconception. The 47-vote ACCEPTED forum answer is wrong; a 12-vote staff reply corrects it."
    expected_sources: [docs, forum]
    relevant:
      - { id: "docs:retries-and-backoff:timeouts", grade: 2 }
      - { id: "forum:t_0007", grade: 2 }
    expects_conflict: C2
    answer_must_contain: ["fail-fast"]

  - qid: q06
    query: "How do I see the payload of a dead-lettered job from the CLI?"
    intent: how_to
    note: "C3 docs gap. Only a staff forum post documents --include-payload; the CLI reference is silent."
    expected_sources: [forum]
    relevant:
      - { id: "forum:t_0012", grade: 2 }
      - { id: "docs:cli-reference", grade: 1 }
      - { id: "docs:dead-letter-queue", grade: 1 }
    expects_conflict: C3
    answer_must_contain: ["include-payload"]

  - qid: q07
    query: "I am on v2.4, how do I configure backoff?"
    intent: how_to
    note: "Hard version filter. v3-only content must be excluded or explicitly labelled."
    expected_sources: [docs]
    relevant:
      - { id: "docs:migration-v2-to-v3", grade: 2 }
      - { id: "docs:changelog", grade: 1 }
    answer_must_contain: ["2"]

  - qid: q08
    query: "What breaks when I upgrade from v2 to v3?"
    intent: version_migration
    note: "Multi-source synthesis across all three sources."
    expected_sources: [docs, forum]
    relevant:
      - { id: "docs:migration-v2-to-v3", grade: 2 }
      - { id: "docs:changelog", grade: 2 }
      - { id: "forum:t_0055", grade: 1 }
      - { id: "blog:v3-launch", grade: 1 }
      - { id: "docs:authentication", grade: 1 }
    answer_must_contain: ["X-Zephyr-Key"]

  - qid: q09
    query: "Does the Zephyr CLI work on Windows?"
    intent: api_reference
    note: "C4 conditional. Blog says yes (3.1), forum says no (3.0). Both true -- must scope, not pick."
    expected_sources: [blog, forum]
    relevant:
      - { id: "blog:windows-support-lands", grade: 2 }
      - { id: "forum:t_0019", grade: 2 }
      - { id: "docs:changelog", grade: 1 }
    expects_conflict: C4
    answer_must_contain: ["3.1"]

  - qid: q10
    query: "Why are my jobs landing in the DLQ right after a rate limit?"
    intent: troubleshooting
    note: "Multi-hop: requires joining retry-budget exhaustion with DLQ entry conditions."
    expected_sources: [forum, docs]
    relevant:
      - { id: "forum:t_0052", grade: 2 }
      - { id: "forum:t_0041", grade: 1 }
      - { id: "docs:dead-letter-queue", grade: 1 }
      - { id: "docs:rate-limits", grade: 1 }
    answer_must_contain: ["retr"]

  - qid: q11
    query: "How do I integrate Zephyr with Kubernetes CronJobs?"
    intent: how_to
    note: "OUT OF SCOPE. Deliberately absent from the corpus. Must refuse, not hallucinate."
    expected_sources: []
    relevant: []
    expects_refusal: true

  - qid: q12
    query: "Is Zephyr better than self-hosting Redis?"
    intent: opinion
    note: "Opinion. Blog-weighted, should read as hedged rather than promotional."
    expected_sources: [blog]
    relevant:
      - { id: "blog:queue-vs-self-hosted", grade: 2 }
    answer_must_contain: ["self-host"]

  - qid: q13
    query: "Does the dead-letter queue retry jobs automatically?"
    intent: api_reference
    note: "C12 misconception. A low-vote forum guess says it sweeps hourly; it does not."
    expected_sources: [docs]
    relevant:
      - { id: "docs:dead-letter-queue:replay-is-manual", grade: 2 }
      - { id: "forum:t_0031", grade: 2 }
    expects_conflict: C12
    answer_must_contain: ["manual"]

  - qid: q14
    query: "What is the default worker concurrency?"
    intent: api_reference
    note: "C11 FALSE-POSITIVE TEST. Managed workers default to 10, self-hosted agents to CPU count. Different components -- must be labelled complementary, NOT contradictory."
    expected_sources: [docs]
    relevant:
      - { id: "docs:concurrency-and-workers", grade: 2 }
      - { id: "forum:t_0035", grade: 1 }
      - { id: "docs:self-hosted-agents", grade: 1 }
    expects_conflict: C11
    expects_no_conflict: true
    answer_must_contain: ["10"]

  - qid: q15
    query: "Why is the same job running twice?"
    intent: troubleshooting
    note: "Diagnostic causal chain: visibility timeout shorter than handler runtime."
    expected_sources: [forum, docs]
    relevant:
      - { id: "forum:t_0066", grade: 2 }
      - { id: "forum:t_0049", grade: 2 }
      - { id: "docs:concurrency-and-workers", grade: 1 }
      - { id: "docs:idempotency", grade: 1 }
    answer_must_contain: ["visibility"]
